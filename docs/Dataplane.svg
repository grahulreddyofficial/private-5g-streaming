<svg width="100%" viewBox="0 0 690 330" xmlns="http://www.w3.org/2000/svg" role="img">
  <title>Private 5G surveillance — end-to-end data plane flow</title>
  <desc>Linear pipeline: SCB800 camera streams H.264 RTSP over 5G NR Uu to gNodeB, forwarded via N3 GTP-U tunnel to Celona UPF, decapsulated and sent over N6 as RTSP/TCP to MediaMTX, which transcodes to WebRTC and delivers via WHEP to the React dashboard.</desc>
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <style>
      .bg-page    { fill: #ffffff }
      .bg-node-t  { fill: #dafbe1; stroke: #2da44e }
      .bg-node-p  { fill: #fbefff; stroke: #8250df }
      .bg-node-b  { fill: #ddf4ff; stroke: #0969da }
      .bg-callout { fill: #f6f8fa; stroke: #d0d7de }
      .t-head  { fill: #24292f; font-family: -apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif; font-size: 13px; font-weight: 600 }
      .t-sub   { fill: #57606a; font-family: -apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif; font-size: 11px }
      .t-lbl   { fill: #57606a; font-family: -apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif; font-size: 10px }
      .t-ip-t  { fill: #2da44e; font-family: -apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif; font-size: 10px; font-weight: 700 }
      .t-ip-p  { fill: #8250df; font-family: -apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif; font-size: 10px; font-weight: 700 }
      .t-ip-b  { fill: #0969da; font-family: -apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif; font-size: 10px; font-weight: 700 }
      .t-title { fill: #57606a; font-family: -apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif; font-size: 11px }
      .arr-eth   { stroke: #57606a; stroke-width: 1.2; fill: none }
      .arr-radio { stroke: #2da44e; stroke-width: 1.5; stroke-dasharray: 6 3; fill: none }
      .arr-media { stroke: #0969da; stroke-width: 1; stroke-dasharray: 3 3; fill: none }
      .leader    { stroke: #d0d7de; stroke-width: 0.5; stroke-dasharray: 2 2; fill: none }

      @media (prefers-color-scheme: dark) {
        .bg-page    { fill: #0d1117 }
        .bg-node-t  { fill: #0d2a1a; stroke: #39d353 }
        .bg-node-p  { fill: #2d1a4a; stroke: #bc8cff }
        .bg-node-b  { fill: #0c2d6b; stroke: #58a6ff }
        .bg-callout { fill: #161b22; stroke: #30363d }
        .t-head  { fill: #e6edf3 }
        .t-sub   { fill: #8b949e }
        .t-lbl   { fill: #8b949e }
        .t-ip-t  { fill: #39d353 }
        .t-ip-p  { fill: #bc8cff }
        .t-ip-b  { fill: #58a6ff }
        .t-title { fill: #8b949e }
        .arr-eth   { stroke: #8b949e }
        .arr-radio { stroke: #39d353 }
        .arr-media { stroke: #58a6ff }
        .leader    { stroke: #30363d }
      }
    </style>
  </defs>

  <rect width="690" height="330" class="bg-page"/>

  <!-- Top label -->
  <text x="340" y="22" class="t-title" text-anchor="middle">End-to-end video data plane · left to right</text>

  <!-- NODE 1: IP Camera -->
  <rect x="18" y="38" width="122" height="94" rx="7" class="bg-node-t" stroke-width="0.8"/>
  <text x="79" y="60" class="t-head" text-anchor="middle">IP camera</text>
  <text x="79" y="78" class="t-sub" text-anchor="middle">SCB800 · 5G UE</text>
  <text x="79" y="94" class="t-ip-t" text-anchor="middle">172.20.0.55</text>
  <text x="79" y="112" class="t-sub" text-anchor="middle">H.264 · RTSP</text>

  <!-- Arrow 1: NR Uu -->
  <line x1="140" y1="85" x2="190" y2="85" class="arr-radio" marker-end="url(#arr)"/>
  <text x="165" y="76" class="t-lbl" text-anchor="middle">NR Uu</text>
  <text x="165" y="98" class="t-lbl" text-anchor="middle">radio</text>

  <!-- NODE 2: gNodeB -->
  <rect x="190" y="38" width="122" height="94" rx="7" class="bg-node-t" stroke-width="0.8"/>
  <text x="251" y="60" class="t-head" text-anchor="middle">gNodeB AP</text>
  <text x="251" y="78" class="t-sub" text-anchor="middle">Celona · 5G NR</text>
  <text x="251" y="94" class="t-ip-t" text-anchor="middle">172.20.0.10</text>
  <text x="251" y="112" class="t-sub" text-anchor="middle">RLC · MAC · PDCP</text>

  <!-- Arrow 2: N3 GTP-U -->
  <line x1="312" y1="85" x2="362" y2="85" class="arr-eth" marker-end="url(#arr)"/>
  <text x="337" y="76" class="t-lbl" text-anchor="middle">N3</text>
  <text x="337" y="98" class="t-lbl" text-anchor="middle">GTP-U</text>

  <!-- NODE 3: UPF -->
  <rect x="362" y="38" width="122" height="94" rx="7" class="bg-node-p" stroke-width="0.8"/>
  <text x="423" y="60" class="t-head" text-anchor="middle">Celona UPF</text>
  <text x="423" y="78" class="t-sub" text-anchor="middle">Edge · user plane</text>
  <text x="423" y="94" class="t-ip-p" text-anchor="middle">172.20.0.11</text>
  <text x="423" y="112" class="t-sub" text-anchor="middle">GTP-U decap · N6 fwd</text>

  <!-- Arrow 3: N6 RTSP -->
  <line x1="484" y1="85" x2="534" y2="85" class="arr-eth" marker-end="url(#arr)"/>
  <text x="509" y="76" class="t-lbl" text-anchor="middle">N6</text>
  <text x="509" y="98" class="t-lbl" text-anchor="middle">RTSP/TCP</text>

  <!-- NODE 4: MediaMTX -->
  <rect x="534" y="38" width="130" height="94" rx="7" class="bg-node-p" stroke-width="0.8"/>
  <text x="599" y="58" class="t-head" text-anchor="middle">MediaMTX</text>
  <text x="599" y="76" class="t-sub" text-anchor="middle">v1.17.1 · server</text>
  <text x="599" y="94" class="t-ip-p" text-anchor="middle">172.20.0.17</text>
  <text x="599" y="110" class="t-sub" text-anchor="middle">RTSP &#x2192; WebRTC</text>
  <text x="599" y="126" class="t-sub" text-anchor="middle">HLS · RTMP · SRT</text>

  <!-- Arrow 4: WebRTC down-left -->
  <path d="M599 132 L599 168 L370 168 L370 192" class="arr-media" marker-end="url(#arr)"/>
  <text x="490" y="162" class="t-lbl" text-anchor="middle">WebRTC (WHEP)</text>

  <!-- NODE 5: Dashboard -->
  <rect x="258" y="192" width="220" height="78" rx="7" class="bg-node-b" stroke-width="0.8"/>
  <text x="368" y="214" class="t-head" text-anchor="middle">Dashboard client</text>
  <text x="368" y="232" class="t-sub" text-anchor="middle">React / Vite + Node.js/Express</text>
  <text x="368" y="248" class="t-ip-b" text-anchor="middle">172.20.0.12</text>
  <text x="368" y="264" class="t-sub" text-anchor="middle">browser-native WebRTC player</text>

  <!-- Protocol callouts -->
  <line x1="79" y1="132" x2="79" y2="166" class="leader"/>
  <rect x="18" y="168" width="122" height="30" rx="4" class="bg-callout" stroke-width="0.5"/>
  <text x="79" y="187" class="t-lbl" text-anchor="middle">RTP/H.264 over RTSP</text>

  <line x1="251" y1="132" x2="251" y2="166" class="leader"/>
  <rect x="190" y="168" width="122" height="30" rx="4" class="bg-callout" stroke-width="0.5"/>
  <text x="251" y="187" class="t-lbl" text-anchor="middle">encap in NR PDCP</text>

  <line x1="423" y1="132" x2="423" y2="166" class="leader"/>
  <rect x="362" y="168" width="122" height="30" rx="4" class="bg-callout" stroke-width="0.5"/>
  <text x="423" y="187" class="t-lbl" text-anchor="middle">inner IP restored</text>

  <!-- Legend -->
  <line x1="30" y1="296" x2="64" y2="296" class="arr-eth" marker-end="url(#arr)" marker-start="url(#arr)"/>
  <text x="70" y="300" class="t-lbl">Ethernet / N-interface</text>
  <line x1="210" y1="296" x2="244" y2="296" class="arr-radio" marker-end="url(#arr)"/>
  <text x="250" y="300" class="t-lbl">5G NR radio (Uu)</text>
  <line x1="390" y1="296" x2="424" y2="296" class="arr-media" marker-end="url(#arr)"/>
  <text x="430" y="300" class="t-lbl">WebRTC media stream</text>
</svg>
