<svg width="100%" viewBox="0 0 680 660" xmlns="http://www.w3.org/2000/svg" role="img">
  <title>Private 5G surveillance system — layered architecture</title>
  <desc>Three-layer system architecture: application layer (React dashboard + MediaMTX), 5G core (Celona Conductor + UPF + L2 switch), and RAN (gNodeB + SCB800 UE camera), with 3GPP interface labels.</desc>
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <style>
      .bg-page   { fill: #ffffff }
      .bg-layer  { fill: #f6f8fa; stroke: #d0d7de }
      .bg-node-b { fill: #ddf4ff; stroke: #0969da }
      .bg-node-p { fill: #fbefff; stroke: #8250df }
      .bg-node-t { fill: #dafbe1; stroke: #2da44e }
      .bg-node-g { fill: #f6f8fa; stroke: #d0d7de }
      .t-head    { fill: #24292f; font-family: -apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif; font-size: 13px; font-weight: 600 }
      .t-sub     { fill: #57606a; font-family: -apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif; font-size: 11px }
      .t-label   { fill: #57606a; font-family: -apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif; font-size: 10px }
      .t-section { fill: #24292f; font-family: -apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif; font-size: 12px; font-weight: 700 }
      .t-badge-b { fill: #0969da; font-family: -apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif; font-size: 10px; font-weight: 600 }
      .t-badge-p { fill: #8250df; font-family: -apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif; font-size: 10px; font-weight: 600 }
      .t-badge-t { fill: #2da44e; font-family: -apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif; font-size: 10px; font-weight: 600 }
      .arr-eth   { stroke: #57606a; stroke-width: 1.2; fill: none }
      .arr-radio { stroke: #2da44e; stroke-width: 1.5; stroke-dasharray: 6 3; fill: none }
      .arr-media { stroke: #0969da; stroke-width: 1; stroke-dasharray: 3 3; fill: none }
      .note-box  { fill: none; stroke: #d0d7de; stroke-width: 0.5; stroke-dasharray: 4 3 }
      @media (prefers-color-scheme: dark) {
        .bg-page   { fill: #0d1117 }
        .bg-layer  { fill: #161b22; stroke: #30363d }
        .bg-node-b { fill: #0c2d6b; stroke: #58a6ff }
        .bg-node-p { fill: #2d1a4a; stroke: #bc8cff }
        .bg-node-t { fill: #0d2a1a; stroke: #39d353 }
        .bg-node-g { fill: #161b22; stroke: #30363d }
        .t-head    { fill: #e6edf3 }
        .t-sub     { fill: #8b949e }
        .t-label   { fill: #8b949e }
        .t-section { fill: #e6edf3 }
        .t-badge-b { fill: #58a6ff }
        .t-badge-p { fill: #bc8cff }
        .t-badge-t { fill: #39d353 }
        .arr-eth   { stroke: #8b949e }
        .arr-radio { stroke: #39d353 }
        .arr-media { stroke: #58a6ff }
        .note-box  { stroke: #30363d }
      }
    </style>
  </defs>
  <rect width="680" height="660" class="bg-page"/>
  <!-- LAYER 1: Application -->
  <rect x="30" y="36" width="620" height="130" rx="10" class="bg-layer" stroke-width="0.5"/>
  <text x="50" y="56" class="t-section">Application layer</text>
  <rect x="50" y="68" width="196" height="84" rx="7" class="bg-node-b" stroke-width="0.8"/>
  <text x="148" y="90" class="t-head" text-anchor="middle">Dashboard client</text>
  <text x="148" y="108" class="t-sub" text-anchor="middle">React / Vite + Node.js/Express</text>
  <text x="148" y="124" class="t-badge-b" text-anchor="middle">172.20.0.12</text>
  <text x="148" y="140" class="t-sub" text-anchor="middle">WebRTC consumer (WHEP)</text>
  <rect x="434" y="68" width="196" height="84" rx="7" class="bg-node-b" stroke-width="0.8"/>
  <text x="532" y="90" class="t-head" text-anchor="middle">MediaMTX v1.17.1</text>
  <text x="532" y="108" class="t-sub" text-anchor="middle">RTSP &#x2192; WebRTC / HLS / SRT</text>
  <text x="532" y="124" class="t-badge-b" text-anchor="middle">172.20.0.17</text>
  <text x="532" y="140" class="t-sub" text-anchor="middle">stream transcoding server</text>
  <line x1="246" y1="110" x2="310" y2="110" class="arr-media" marker-end="url(#arr)"/>
  <line x1="340" y1="110" x2="434" y2="110" class="arr-media"/>
  <text x="340" y="103" class="t-label" text-anchor="middle">WebRTC (WHEP)</text>
  <!-- LAYER 2: 5G Core -->
  <rect x="30" y="194" width="620" height="156" rx="10" class="bg-layer" stroke-width="0.5"/>
  <text x="50" y="214" class="t-section">5G core (Celona) &#xB7; CNPN &#xB7; 3GPP Rel-16 SA</text>
  <rect x="50" y="226" width="188" height="108" rx="7" class="bg-node-p" stroke-width="0.8"/>
  <text x="144" y="248" class="t-head" text-anchor="middle">Celona Conductor</text>
  <text x="144" y="266" class="t-sub" text-anchor="middle">AMF &#xB7; SMF &#xB7; UDM &#xB7; PCF</text>
  <text x="144" y="282" class="t-sub" text-anchor="middle">Control plane (N2 / N11)</text>
  <text x="144" y="298" class="t-sub" text-anchor="middle">SIM provisioning</text>
  <text x="144" y="314" class="t-badge-p" text-anchor="middle">cloud-hosted</text>
  <rect x="268" y="226" width="188" height="108" rx="7" class="bg-node-p" stroke-width="0.8"/>
  <text x="362" y="248" class="t-head" text-anchor="middle">Celona Edge (UPF)</text>
  <text x="362" y="266" class="t-sub" text-anchor="middle">User plane &#xB7; N3 / N6 / N9</text>
  <text x="362" y="282" class="t-badge-p" text-anchor="middle">172.20.0.11</text>
  <text x="362" y="298" class="t-sub" text-anchor="middle">CGNAT enabled</text>
  <text x="362" y="314" class="t-sub" text-anchor="middle">UE IP pool → 172.20.0.0/24</text>
  <rect x="486" y="226" width="144" height="108" rx="7" class="bg-node-g" stroke-width="0.8"/>
  <text x="558" y="248" class="t-head" text-anchor="middle">L2 switch</text>
  <text x="558" y="266" class="t-badge-b" text-anchor="middle">172.20.0.1</text>
  <text x="558" y="282" class="t-sub" text-anchor="middle">172.20.0.0 /24</text>
  <text x="558" y="298" class="t-sub" text-anchor="middle">flat broadcast domain</text>
  <text x="558" y="314" class="t-sub" text-anchor="middle">all nodes same subnet</text>
  <line x1="238" y1="270" x2="268" y2="270" class="arr-eth" marker-end="url(#arr)" marker-start="url(#arr)"/>
  <text x="253" y="263" class="t-label" text-anchor="middle">N2</text>
  <line x1="456" y1="270" x2="486" y2="270" class="arr-eth" marker-end="url(#arr)"/>
  <text x="471" y="263" class="t-label" text-anchor="middle">N6</text>
  <!-- LAYER 3: RAN -->
  <rect x="30" y="378" width="620" height="156" rx="10" class="bg-layer" stroke-width="0.5"/>
  <text x="50" y="398" class="t-section">Radio access network &#xB7; NR Sub-6 GHz &#xB7; TDD</text>
  <rect x="50" y="410" width="196" height="108" rx="7" class="bg-node-t" stroke-width="0.8"/>
  <text x="148" y="432" class="t-head" text-anchor="middle">Celona gNodeB AP</text>
  <text x="148" y="450" class="t-sub" text-anchor="middle">5G NR access point</text>
  <text x="148" y="466" class="t-badge-t" text-anchor="middle">172.20.0.10</text>
  <text x="148" y="482" class="t-sub" text-anchor="middle">F1 / NG interface</text>
  <text x="148" y="498" class="t-sub" text-anchor="middle">&#x2192; Conductor via N2</text>
  <rect x="434" y="410" width="196" height="108" rx="7" class="bg-node-t" stroke-width="0.8"/>
  <text x="532" y="432" class="t-head" text-anchor="middle">SCB800 IP camera (UE)</text>
  <text x="532" y="450" class="t-sub" text-anchor="middle">5G NR UE &#xB7; IPv4 PDU session</text>
  <text x="532" y="466" class="t-badge-t" text-anchor="middle">172.20.0.55</text>
  <text x="532" y="482" class="t-sub" text-anchor="middle">H.264 RTSP source</text>
  <text x="532" y="498" class="t-sub" text-anchor="middle">SIM-provisioned via Conductor</text>
  <line x1="246" y1="464" x2="434" y2="464" class="arr-radio" marker-end="url(#arr)" marker-start="url(#arr)"/>
  <text x="340" y="456" class="t-label" text-anchor="middle">NR Uu (5G radio interface)</text>
  <!-- Vertical connectors -->
  <line x1="558" y1="152" x2="558" y2="194" class="arr-eth" marker-end="url(#arr)" marker-start="url(#arr)"/>
  <path d="M532 152 L532 172 L362 172 L362 194" class="arr-media" marker-end="url(#arr)"/>
  <text x="447" y="167" class="t-label" text-anchor="middle">RTSP pull</text>
  <path d="M148 378 L148 354 L362 354 L362 334" class="arr-eth" marker-end="url(#arr)" marker-start="url(#arr)"/>
  <text x="255" y="348" class="t-label" text-anchor="middle">N3 (GTP-U tunnel)</text>
  <!-- Note -->
  <rect x="30" y="554" width="620" height="36" rx="6" class="note-box"/>
  <text x="340" y="574" class="t-label" text-anchor="middle">Celona Network Domain assigns UE IPs from 172.20.0.0/24 &#x2014; CGNAT enabled, UE shares LAN subnet, enabling direct server&#x2192;camera reachability</text>
  <!-- Legend -->
  <line x1="50" y1="618" x2="84" y2="618" class="arr-eth" marker-end="url(#arr)" marker-start="url(#arr)"/>
  <text x="90" y="622" class="t-label">Ethernet / 3GPP N-interface</text>
  <line x1="246" y1="618" x2="280" y2="618" class="arr-radio" marker-end="url(#arr)"/>
  <text x="286" y="622" class="t-label">5G NR radio (Uu)</text>
  <line x1="390" y1="618" x2="424" y2="618" class="arr-media" marker-end="url(#arr)"/>
  <text x="430" y="622" class="t-label">Media stream</text>
</svg>
